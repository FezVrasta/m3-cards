name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      # Runs on CI rather than in release.yml on purpose: a failure here is
      # seen before a release exists, where the same failure would leave a
      # published release with no bundle attached to it.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
